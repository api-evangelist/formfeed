aid: formfeed
name: Formfeed
image: https://formfeed.dev/app-screenshots/en/editor.webp
description: Formfeed offers a PDF and image generation API that lets developers render templates written in Jinja2, Liquid, or Handlebars into
  PDFs, PNGs, and other formats. It can also convert Word and PowerPoint files. The service runs in Frankfurt with EU‑only data residency and
  provides a free tier of 100 units per month. SDKs are available for TypeScript and Python, a CLI exists, and there is MCP integration for AI
  agents. Features include batch rendering, webhook notifications, versioned templates, and a visual editor for designing documents.
